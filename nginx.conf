server {
    listen 80 default_server;
    listen 8080 default_server;
    listen 3000 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Proxy API requests directly to Railway Backend API
    location /api/ {
        proxy_pass https://we-care-api-es.up.railway.app/api/;
        proxy_set_header Host we-care-api-es.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Proxy uploads directly to Railway Backend API
    location /uploads/ {
        proxy_pass https://we-care-api-es.up.railway.app/uploads/;
        proxy_set_header Host we-care-api-es.up.railway.app;
        proxy_ssl_server_name on;
    }

    # Handle /admin/assets directly
    location /admin/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Handle /admin/ images/logos directly
    location ~* ^/admin/(.+\.(?:png|jpg|jpeg|gif|ico|svg|webp))$ {
        alias /usr/share/nginx/html/$1;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Root /assets
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing fallback for /admin/ subpath
    location /admin {
        alias /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # SPA routing fallback for root /
    location / {
        try_files $uri $uri/ /index.html;
    }
}
